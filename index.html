<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comb-Search — Daily arXiv Papers for Combinatorics">
    <title>Comb-Search</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="js/data-config.js"></script>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="header-left">
            <a href="https://github.com/ThreeLu/Web-for-Comb" class="header-link" target="_blank">Comb-Search</a>
        </div>
        <div class="header-right">
            <button id="searchToggle" class="icon-btn" title="Search">🔍</button>
            <button id="dateBtn" class="date-btn">
                <span id="dateDisplay">—</span>
                <span class="date-arrow">▾</span>
            </button>
        </div>
    </div>
    <div id="searchBar" class="search-bar hidden">
        <input type="text" id="searchInput" placeholder="Search title, author, abstract...">
    </div>
    <div id="datePicker" class="date-picker-popup hidden">
        <input type="text" id="flatpickrInput" data-input>
    </div>
</header>

<main id="main">
    <div id="loading" class="state-msg">Loading…</div>
    <div id="papers"></div>
    <div id="noPapers" class="state-msg hidden">No papers for this date.</div>
    <div id="noMatch" class="state-msg hidden">No matches for this search.</div>
</main>

<footer>
    <div id="trendBar" class="trend-bar"></div>
    <div class="footer-meta">
        Papers from <a href="https://arxiv.org">arXiv</a> —
        AI summaries may contain errors
    </div>
</footer>

<script src="js/app.js"></script>
</body>
</html>
