<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comb-Search Settings — Customize Your Preferences">
    <title>Settings — Comb-Search</title>
    <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="shortcut icon" type="image/svg+xml" href="assets/logo.svg">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

    <!-- Data Source Configuration -->
    <script src="js/data-config.js"></script>
    <script src="js/keywords-config.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="header-left">
                    <a href="https://github.com/ThreeLu/Web-for-Comb" target="_blank" class="github-button">
                        <svg height="20" width="20" viewBox="0 0 16 16" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                        </svg>
                        <span class="github-text">GitHub</span>
                    </a>
                </div>
                
                <div class="header-center">
                    <a href="index.html" class="site-logo">
                        <img src="assets/logo.svg" alt="Comb-Search Logo" class="logo-image">
                        <span class="site-title">Comb-Search</span>
                    </a>
                </div>
                
                <div class="header-controls">
                    <a href="index.html" class="back-button">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z" fill="currentColor"/>
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <main class="settings-page">
            <div class="settings-container">
                <div class="settings-header">
                    <h1>Settings</h1>
                    <p>Customize your Comb-Search experience — manage keywords and author watchlist</p>
                </div>

                <div class="settings-content">
                    <div class="settings-section">
                        <div class="keyword-section-title">
                            <div class="keyword-section-title-left">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7V17C3 18.1 3.9 18.99 5 18.99L16 19C16.67 19 17.27 18.67 17.63 18.16L22 12L17.63 5.84ZM16 17H5V7H16L19.55 12L16 17Z" fill="currentColor"/>
                                </svg>
                                Interested Keywords
                            </div>
                            <button id="copyKeywords" class="copy-button" title="Copy keywords to clipboard">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/>
                                </svg>
                                Copy
                            </button>
                        </div>
                        <div class="settings-card">
                            <div class="settings-item">
                                <div class="tag-selector">
                                    <div class="selected-tags" id="selectedKeywords">
                                        <div class="empty-tag-message" id="emptyTagMessage">No keywords added yet. Add some keywords below.</div>
                                    </div>
                                    <div class="tag-input-container">
                                        <input type="text" id="keywordInput" class="settings-input" placeholder="Enter a keyword and press Enter...">
                                        <button id="addKeyword" class="add-tag-button">Add</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="settings-section">
                        <div class="keyword-section-title">
                            <div class="keyword-section-title-left">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" fill="currentColor"/>
                                </svg>
                                Interested Authors
                            </div>
                            <button id="copyAuthors" class="copy-button" title="Copy authors to clipboard">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z" fill="currentColor"/>
                                </svg>
                                Copy
                            </button>
                        </div>
                        <div class="settings-card">
                            <div class="settings-item">
                                <div class="tag-selector">
                                    <div class="selected-tags" id="selectedAuthors">
                                        <div class="empty-tag-message" id="emptyAuthorMessage">No authors added yet. Add some authors below.</div>
                                    </div>
                                    <div class="tag-input-container">
                                        <input type="text" id="authorInput" class="settings-input" placeholder="Enter an author name and press Enter...">
                                        <button id="addAuthor" class="add-tag-button">Add</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="settings-actions">
                    <button id="resetSettings" class="button">Reset to Default</button>
                    <button id="saveSettings" class="button primary">Save Settings</button>
                </div>
            </div>
        </main>
        
        <footer>
            <div class="footer-content">
                <p>Comb-Search | <a href="https://github.com/ThreeLu/Web-for-Comb" target="_blank">GitHub</a></p>
            </div>
        </footer>
    </div>

    <script src="js/settings.js"></script>
</body>
</html>
