[project]
name = "comb-search"
version = "0.2.0"
description = "Daily arXiv paper tracker for combinatorics and graph theory"
authors = [
    {name = "ThreeLu"},
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "openai>=1.0",
]
license = "MIT"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
